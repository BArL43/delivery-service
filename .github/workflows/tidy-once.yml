name: One-time module tidy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/order-service/go.mod
      - name: Tidy order-service modules
        working-directory: backend/order-service
        run: go mod tidy
      - name: Commit module metadata
        run: |
          if git diff --quiet -- backend/order-service/go.mod backend/order-service/go.sum; then
            echo "Module files are already tidy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/order-service/go.mod backend/order-service/go.sum
          git commit -m "build: tidy order-service modules"
          git push origin HEAD:main
