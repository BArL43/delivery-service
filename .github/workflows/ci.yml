name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/auth-service
          - backend/order-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build auth service
        run: docker build -t delivery-auth-service:test backend/auth-service
      - name: Build order service
        run: docker build -t delivery-order-service:test backend/order-service
      - name: Build frontend
        run: docker build -t delivery-frontend:test frontend
      - name: Build proxy
        run: docker build -t delivery-proxy:test -f Dockerfile.proxy .
      - name: Validate compose
        env:
          POSTGRES_PASSWORD: test-password
          JWT_SECRET: github-actions-test-secret-at-least-32-bytes
        run: docker compose config >/dev/null
