name: Runtime contract cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-contract-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime_contract_fix.py')
          path.write_text(path.read_text().replace("r'''", "'''"))
          PY
          python3 scripts/runtime_contract_fix.py
          gofmt -w backend/order-service/internal/storage/order_repository.go backend/order-service/internal/storage/postgres_order_repository.go backend/order-service/internal/handlers/handler.go backend/order-service/internal/handlers/courier_handler.go backend/order-service/internal/handlers/courier_handler_test.go

      - name: Verify auth service
        working-directory: backend/auth-service
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/api

      - name: Verify order service
        working-directory: backend/order-service
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/api

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Docker images and compose
        run: |
          docker build -t delivery-auth-ci ./backend/auth-service
          docker build -t delivery-order-ci ./backend/order-service
          docker build -t delivery-frontend-ci ./frontend
          docker build -t delivery-proxy-ci -f Dockerfile.proxy .
          JWT_SECRET=ci-secret-0123456789abcdefghijklmnopqrstuvwxyz docker compose config >/dev/null

      - name: Commit verified runtime fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align frontend and order API contracts'
          git push origin HEAD:main
