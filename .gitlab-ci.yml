stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_TAG: latest

test_auth_service:
  stage: test
  image: golang:1.26-alpine
  script:
    - cd backend/auth-service
    - go test ./...
    - go build ./...

test_order_service:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd backend/order-service
    - go test ./...
    - go build ./...

test_frontend:
  stage: test
  image: node:20-alpine
  cache:
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build

build_and_push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - test -n "$DOCKERHUB_USERNAME" || (echo "DOCKERHUB_USERNAME is empty. Set it in GitLab CI/CD Variables." && exit 1)
    - test -n "$DOCKERHUB_TOKEN" || (echo "DOCKERHUB_TOKEN is empty. Set Docker Hub Access Token in GitLab CI/CD Variables." && exit 1)
    - mkdir -p /kaniko/.docker
    - export DOCKER_AUTH_BASE64="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n\r')"
    - printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$DOCKER_AUTH_BASE64" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/backend/auth-service" --dockerfile "$CI_PROJECT_DIR/backend/auth-service/Dockerfile" --destination "docker.io/${DOCKERHUB_USERNAME}/delivery-auth-service:${IMAGE_TAG}" --cache=true
    - /kaniko/executor --context "$CI_PROJECT_DIR/frontend" --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile" --destination "docker.io/${DOCKERHUB_USERNAME}/delivery-frontend:${IMAGE_TAG}" --cache=true
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile.proxy" --destination "docker.io/${DOCKERHUB_USERNAME}/delivery-proxy:${IMAGE_TAG}" --cache=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_to_server:
  stage: deploy
  image: alpine:latest
  retry: 2
  before_script:
    - apk add --no-cache openssh-client netcat-openbsd
    - test -n "$SSH_HOST" || (echo "SSH_HOST is empty. Set it in GitLab CI/CD Variables." && exit 1)
    - test -n "$SSH_PORT" || (echo "SSH_PORT is empty. Set it in GitLab CI/CD Variables." && exit 1)
    - test -n "$SSH_USER" || (echo "SSH_USER is empty. Set it in GitLab CI/CD Variables." && exit 1)
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is empty. Set it in GitLab CI/CD Variables." && exit 1)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - nc -zvw5 "$SSH_HOST" "$SSH_PORT" || (echo "Cannot reach $SSH_HOST:$SSH_PORT from this runner. Check runner network/firewall or use a runner in the same network." && exit 1)
    - ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - ssh -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT $SSH_USER@$SSH_HOST "cd /opt/delivery-service && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml pull && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml up -d --force-recreate --remove-orphans && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml ps"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
