stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_TAG: latest

test_auth_service:
  stage: test
  image: golang:1.26-alpine
  before_script:
    - apk add --no-cache build-base
  script:
    - cd backend/auth-service
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race ./...
    - go build ./...

test_order_service:
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache build-base
  script:
    - cd backend/order-service
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race ./...
    - go build ./...

test_frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build

build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:latest-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
  script:
    - docker build -t docker.io/${DOCKERHUB_USERNAME}/delivery-auth-service:${IMAGE_TAG} ./backend/auth-service
    - docker build -t docker.io/${DOCKERHUB_USERNAME}/delivery-order-service:${IMAGE_TAG} ./backend/order-service
    - docker build -t docker.io/${DOCKERHUB_USERNAME}/delivery-frontend:${IMAGE_TAG} ./frontend
    - docker build -t docker.io/${DOCKERHUB_USERNAME}/delivery-proxy:${IMAGE_TAG} -f Dockerfile.proxy .
    - docker push docker.io/${DOCKERHUB_USERNAME}/delivery-auth-service:${IMAGE_TAG}
    - docker push docker.io/${DOCKERHUB_USERNAME}/delivery-order-service:${IMAGE_TAG}
    - docker push docker.io/${DOCKERHUB_USERNAME}/delivery-frontend:${IMAGE_TAG}
    - docker push docker.io/${DOCKERHUB_USERNAME}/delivery-proxy:${IMAGE_TAG}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd /opt/delivery-service && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml pull && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml up -d --remove-orphans && docker compose --env-file .env.dockerhub -f docker-compose.hub.yml ps"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
