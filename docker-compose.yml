services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    build:
      context: ./backend/auth-service
    environment:
      AUTH_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery?sslmode=disable
    command: ["sh", "-c", "goose -dir /app/migrations postgres '$$AUTH_DB_DSN' up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  order-migrate:
    build:
      context: ./backend/order-service
    environment:
      ORDER_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery?sslmode=disable
    command: ["sh", "-c", "goose -dir /app/migrations postgres '$$ORDER_DB_DSN' up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      AUTH_PORT: "8081"
      AUTH_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-delivery-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  order-service:
    build:
      context: ./backend/order-service
    environment:
      ORDER_PORT: "8080"
      ORDER_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/delivery?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-delivery-auth}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      PRICING_BASE_RATE: ${PRICING_BASE_RATE:-150}
      PRICING_PER_KM_RATE: ${PRICING_PER_KM_RATE:-20}
      PRICING_PER_KG_RATE: ${PRICING_PER_KG_RATE:-50}
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
    depends_on:
      - auth-service
      - order-service
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
